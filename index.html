<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站建设中</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: #a0a4b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .container { max-width: 480px; }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #d0d4e4;
            margin-bottom: 1.5rem;
        }

        .divider {
            width: 32px;
            height: 1px;
            background: #404460;
            margin: 0 auto 2rem;
        }

        .message {
            font-size: 1rem;
            font-weight: 300;
            line-height: 2;
            color: #707488;
        }

        .footer {
            position: fixed;
            bottom: 2rem;
        }

        .footer, .footer a {
            font-size: 0.78rem;
            color: #505468;
            text-decoration: none;
        }

        .footer a:hover { color: #8088a0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>网站建设中</h1>
        <div class="divider"></div>
        <div class="message">敬请期待。</div>
    </div>

    <div class="footer">
        <span>&copy; 2025</span>
    </div>

</body>
</html>
