<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
            background: #0f0f1a;
            color: #a0a4b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .container { max-width: 480px; }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #d0d4e4;
            margin-bottom: 1.5rem;
        }

        .divider {
            width: 32px;
            height: 1px;
            background: #404460;
            margin: 0 auto 2rem;
        }

        .message {
            font-size: 1rem;
            font-weight: 300;
            line-height: 2;
            color: #707488;
        }

        .footer {
            position: fixed;
            bottom: 2rem;
            font-size: 0.78rem;
            color: #505468;
        }

        .footer a {
            color: #606478;
            text-decoration: none;
        }

        .footer a:hover { color: #8088a0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ site.title }}</h1>
        <div class="divider"></div>
        <div class="message">{{ site.description }}</div>
    </div>

    <div class="footer">
        {% if site.footer_text != "" %}
        <a href="{{ site.footer_link }}" target="_blank" rel="noopener">{{ site.footer_text }}</a>
        {% endif %}
    </div>
</body>
</html>
